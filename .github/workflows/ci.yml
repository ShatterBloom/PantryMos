name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Start Postgres
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait db

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - name: Test
        run: pnpm test

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
